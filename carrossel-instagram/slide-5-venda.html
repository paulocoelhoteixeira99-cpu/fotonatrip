<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; font-family: 'Inter', system-ui, sans-serif; background: #0a0a0a; color: #ededed; overflow: hidden; }
  .slide { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 50px 50px 50px; position: relative; }
  .glow { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(13,150,104,0.1) 0%, transparent 70%); border-radius: 50%; bottom: 20%; left: 50%; transform: translateX(-50%); pointer-events: none; }
  .label { font-size: 15px; color: #0d9668; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
  .title { font-size: 72px; font-weight: 800; text-align: center; line-height: 1.08; letter-spacing: -2px; margin-bottom: 6px; }
  .gradient-text { background: linear-gradient(135deg, #059669, #0d9668, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .subtitle { font-size: 30px; color: #a3a3a3; text-align: center; margin-bottom: 20px; line-height: 1.4; }
  /* Stack layout */
  .content-col { display: flex; flex-direction: column; gap: 12px; width: 980px; }
  /* Cart card */
  .cart-card { background: rgba(20,20,20,0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 22px; padding: 18px; }
  .cart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cart-title { font-size: 26px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .cart-title svg { width: 22px; height: 22px; stroke: #0d9668; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .cart-badge { background: rgba(13,150,104,0.15); border: 1px solid rgba(13,150,104,0.25); color: #34d399; font-size: 18px; font-weight: 700; padding: 5px 14px; border-radius: 50px; }
  .cart-items { display: flex; flex-direction: column; gap: 8px; }
  .cart-item { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; height: 80px; padding: 0 14px; }
  .cart-item-photo { width: 64px; height: 64px; border-radius: 10px; overflow: hidden; flex-shrink: 0; }
  .cart-item-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
  .cart-item-info { flex: 1; }
  .cart-item-event { font-size: 18px; color: #a3a3a3; margin-bottom: 2px; }
  .cart-item-name { font-size: 24px; font-weight: 600; margin-bottom: 3px; }
  .cart-item-price { font-size: 24px; font-weight: 800; color: #34d399; }
  .cart-item-remove { width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .cart-item-remove svg { width: 20px; height: 20px; stroke: #a3a3a3; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* Resumo card */
  .resumo-card { background: rgba(20,20,20,0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 22px; padding: 18px; }
  .resumo-title { font-size: 26px; font-weight: 700; margin-bottom: 10px; }
  .resumo-line { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .resumo-line:last-child { border-bottom: none; padding-bottom: 0; }
  .resumo-label { font-size: 24px; color: #a3a3a3; }
  .resumo-value { font-size: 24px; font-weight: 600; }
  .resumo-total { color: #34d399; font-size: 34px; font-weight: 800; }
  /* Payment card */
  .payment-card { background: rgba(20,20,20,0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 22px; padding: 18px; }
  .payment-tabs { display: flex; gap: 10px; margin-bottom: 12px; }
  .pay-tab { width: 445px; padding: 14px; border-radius: 14px; text-align: center; font-size: 26px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .pay-tab.active { background: rgba(13,150,104,0.12); border: 1px solid rgba(13,150,104,0.25); color: #34d399; }
  .pay-tab.inactive { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); color: #a3a3a3; }
  .pay-tab svg { width: 28px; height: 28px; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .pay-tab.active svg { stroke: #34d399; }
  .pay-tab.inactive svg { stroke: #a3a3a3; }
  .pay-button { width: 100%; padding: 18px; background: linear-gradient(135deg, #059669, #0d9668); border-radius: 16px; text-align: center; font-size: 30px; font-weight: 700; color: white; box-shadow: 0 0 40px rgba(13,150,104,0.2); }
</style>
</head>
<body>
<div class="slide">
  <div class="glow"></div>
  <div class="label">Venda automática</div>
  <h2 class="title">Ele escolhe, paga e<br><span class="gradient-text">baixa na hora</span></h2>
  <p class="subtitle">Você define o preço.</p>
  <div class="content-col">
    <div class="cart-card">
      <div class="cart-header">
        <div class="cart-title"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>Carrinho</div>
        <div class="cart-badge">3 fotos</div>
      </div>
      <div class="cart-items">
        <div class="cart-item">
          <div class="cart-item-photo"><img src="https://images.pexels.com/photos/3781538/pexels-photo-3781538.jpeg?auto=compress&cs=tinysrgb&w=200&h=200&fit=crop" alt=""></div>
          <div class="cart-item-info"><div class="cart-item-event">Passeio no Parque</div><div class="cart-item-name">Foto #142</div><div class="cart-item-price">R$ 15,00</div></div>
          <div class="cart-item-remove"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
        </div>
        <div class="cart-item">
          <div class="cart-item-photo"><img src="https://images.pexels.com/photos/3775117/pexels-photo-3775117.jpeg?auto=compress&cs=tinysrgb&w=200&h=200&fit=crop" alt=""></div>
          <div class="cart-item-info"><div class="cart-item-event">Passeio no Parque</div><div class="cart-item-name">Foto #087</div><div class="cart-item-price">R$ 15,00</div></div>
          <div class="cart-item-remove"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
        </div>
        <div class="cart-item">
          <div class="cart-item-photo"><img src="https://images.pexels.com/photos/3764542/pexels-photo-3764542.jpeg?auto=compress&cs=tinysrgb&w=200&h=200&fit=crop" alt=""></div>
          <div class="cart-item-info"><div class="cart-item-event">Passeio no Parque</div><div class="cart-item-name">Foto #203</div><div class="cart-item-price">R$ 15,00</div></div>
          <div class="cart-item-remove"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
        </div>
      </div>
    </div>
    <div class="resumo-card">
      <div class="resumo-title">Resumo do pedido</div>
      <div class="resumo-line"><span class="resumo-label">3 fotos</span><span class="resumo-value">R$ 45,00</span></div>
      <div class="resumo-line"><span class="resumo-label">Total</span><span class="resumo-total">R$ 45,00</span></div>
    </div>
    <div class="payment-card">
      <div class="payment-tabs">
        <div class="pay-tab active"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 15h0M2 9.5h20"/></svg>Pix</div>
        <div class="pay-tab inactive"><svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Cartão</div>
      </div>
      <div class="pay-button">Pagar com Pix</div>
    </div>
  </div>
</div>
</body>
</html>
